name: Development acceptance tests
on:
  push:
    branches:
      - development/creature-registry-import-v4
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/parser.test.cjs && node tests/inventory.test.cjs && node tests/backup.test.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.test.cjs
